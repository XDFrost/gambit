name = "gambit"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Optional: the Worker can also serve the built SPA (single-origin deploy, local `wrangler dev`).
# With the frontend on Vercel this is only a fallback for direct visits to the Worker URL.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws/*", "/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

# SQLite-backed Durable Objects (available on the free plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[vars]
ENVIRONMENT = "development"
# Empty = any origin (local dev). Production sets this to the Vercel URL(s).
ALLOWED_ORIGINS = ""

# `wrangler deploy --env production`
[env.production]
name = "gambit"
[env.production.vars]
ENVIRONMENT = "production"
# Comma-separated, no trailing slashes. Add your custom domain here too if you attach one.
ALLOWED_ORIGINS = "https://YOUR-PROJECT.vercel.app"
[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"
[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws/*", "/api/*"]

[observability]
enabled = true
