<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <title>Gambit</title>
    <script>
      try {
        var t = localStorage.getItem('gambit.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/gambit_logo.svg" />
    <link rel="icon" type="image/png" href="/gambit_logo.png" />
    <link rel="apple-touch-icon" href="/gambit_logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
